<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660"><title>ID 4 ESP8266 energy saver wiring</title><rect width="1100" height="660" fill="white"/><g font-family="sans-serif" font-size="17" fill="#172533"><text x="30" y="35">USB-powered NodeMCU ESP8266 — all signal levels 3.3 V; no mains circuit</text><rect x="60" y="160" width="300" height="380" fill="#e4f0fb" stroke="#172533"/><text x="85" y="195">NodeMCU v2 / ESP8266</text><text x="85" y="240">3V3</text><text x="85" y="280">GND</text><text x="85" y="330">D2 / GPIO4 SDA</text><text x="85" y="370">D1 / GPIO5 SCL</text><text x="85" y="420">D5 / GPIO14 RX</text><text x="85" y="460">D6 / GPIO12 TX</text><text x="85" y="510">D7 / GPIO13 INPUT_PULLUP</text><rect x="740" y="160" width="310" height="220" fill="#e6f9f2" stroke="#172533"/><text x="760" y="195">SSD1306 OLED 128×64 @0x3C</text><text x="760" y="240">VCC 3.3 V</text><text x="760" y="280">GND</text><text x="760" y="330">SDA</text><text x="760" y="370">SCL</text><rect x="740" y="405" width="310" height="175" fill="#f5edff" stroke="#172533"/><text x="760" y="432">TEL0084 BLE Micro V1.1</text><text x="760" y="460">RXD ← MCU TX</text><text x="760" y="495">TXD → MCU RX</text><text x="760" y="520">VCC 3.3 V</text><text x="760" y="555">GND</text><text x="40" y="600">Reed contact: closes to GND when magnet/door closed; opens HIGH when door open.</text><text x="40" y="630">BLE UART configured 9600 8N1; separate radio. USB supplies board, 3V3 powers peripherals.</text></g><g fill="none" stroke-width="3"><path stroke="#c33" d="M360 235H680V95H1020M740 235H680M740 515H680V235"/><path stroke="#333" d="M360 275H640V125H1050M740 275H640M740 550H640V275"/><path stroke="#167f56" d="M360 325H740"/><path stroke="#9a7c0a" d="M360 365H740"/><path stroke="#3171bc" d="M360 415H600V490H740"/><path stroke="#8542b1" d="M360 455H740"/><path stroke="#176c69" d="M360 505H470V560H530"/><path stroke="#333" d="M570 560H640V275M530 560L561 541"/></g><g fill="#333"><circle cx="640" cy="275" r="5"/><circle cx="640" cy="560" r="5"/></g><g fill="#c33"><circle cx="680" cy="235" r="5"/></g><g font-family="sans-serif" font-size="15"><text x="750" y="90" fill="#c33">3.3 V rail</text><text x="750" y="120">Common GND rail</text><text x="440" y="540">Reed switch</text></g></svg>